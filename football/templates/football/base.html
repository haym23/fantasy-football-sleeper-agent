<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy Football</title>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
    nav { display: flex; gap: 1rem; padding: .75rem 1rem; background: #171a21; border-bottom: 1px solid #2a2f3a; }
    nav a { color: #7ab3ff; text-decoration: none; }
    main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #2a2f3a; font-size: .9rem; }
    input, select, button { background: #1c2029; color: #e6e6e6; border: 1px solid #2a2f3a; border-radius: 6px; padding: .5rem .7rem; }
    button { cursor: pointer; background: #2a62b8; border: none; }
    .msg { padding: .6rem .8rem; border-radius: 8px; margin: .5rem 0; white-space: pre-wrap; }
    .msg.user { background: #23314d; }
    .msg.bot { background: #1c2029; }
    .muted { color: #8b93a1; font-size: .85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'chat' %}">Chat</a>
    <a href="{% url 'players' %}">Players</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
